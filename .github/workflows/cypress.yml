name: Cypress

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cypress-io/github-action@v6
        with:
          browser: electron
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            reports
            cypress/screenshots
